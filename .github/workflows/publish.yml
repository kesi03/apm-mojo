name: Publish Maven Mojo

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MAVEN_ARGS: "-B -ntp"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Generate Maven settings
        uses: s4u/maven-settings-action@v3.0.0
        with:
          servers: |
            [
              {
                "id": "central",
                "username": "${{ secrets.CENTRAL_USERNAME }}",
                "password": "${{ secrets.CENTRAL_PASSWORD }}"
              }
            ]

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set project version
        run: mvn $MAVEN_ARGS versions:set -DnewVersion="${{ steps.version.outputs.value }}" -DgenerateBackupPoms=false

      - name: Generate and trust GPG key
        run: |
          cat > key-parameters <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 3072
          Name-Real: GitHub Actions Maven Publisher
          Name-Email: github-actions@kesi03.apm-mojo
          Expire-Date: 0
          %commit
          EOF
          gpg --batch --generate-key key-parameters
          KEY_FP=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')
          test -n "$KEY_FP"
          echo "$KEY_FP:6:" | gpg --import-ownertrust
          echo "KEY_FP=$KEY_FP" >> "$GITHUB_ENV"
          rm -f key-parameters

      - name: Publish GPG public key
        run: |
          gpg --keyserver hkps://keyserver.ubuntu.com --send-keys "$KEY_FP"

      - name: Configure GPG
        run: echo "GPG_TTY=$(tty)" >> "$GITHUB_ENV"

      - name: Verify GPG signing
        run: |
          echo "test" | gpg --batch --yes --clearsign > /dev/null

      - name: Deploy to Maven Central
        run: mvn $MAVEN_ARGS clean deploy -Pcentral
