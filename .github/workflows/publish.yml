name: Publish Maven Mojo

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0 or bump: patch, minor, major)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      MAVEN_ARGS: "-B -ntp"
      # MUST be the Sonatype Central Portal token values:
      # CENTRAL_USERNAME = namecode
      # CENTRAL_PASSWORD = secret
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

          # Inject correct Sonatype Central credentials
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ "$version" =~ ^(patch|minor|major)$ ]]; then
            current=$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' pom.xml | head -n1)
            current="${current%-SNAPSHOT}"
            IFS=. read -r major minor patch <<< "$current"
            case "$version" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
            esac
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set project version
        run: mvn $MAVEN_ARGS versions:set -DnewVersion="${{ steps.version.outputs.value }}" -DgenerateBackupPoms=false

      - name: Generate and trust GPG key
        run: |
          cat > key-parameters <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 3072
          Name-Real: GitHub Actions Maven Publisher
          Name-Email: github-actions@kesi03.apm-mojo
          Expire-Date: 0
          %commit
          EOF
          gpg --batch --generate-key key-parameters
          KEY_FP=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')
          echo "$KEY_FP:6:" | gpg --import-ownertrust
          echo "KEY_FP=$KEY_FP" >> "$GITHUB_ENV"

      - name: Publish GPG public key
        run: gpg --keyserver hkps://keyserver.ubuntu.com --send-keys "$KEY_FP"

      - name: Configure GPG
        run: echo "GPG_TTY=$(tty)" >> "$GITHUB_ENV"

      - name: Verify GPG signing
        run: echo "test" | gpg --batch --yes --clearsign > /dev/null

      - name: Deploy to Maven Central
        run: mvn $MAVEN_ARGS clean deploy -Pcentral
