name: Publish Maven Mojo

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0 or bump: patch, minor, major)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      MAVEN_ARGS: "-B -ntp"
      # MUST be the Sonatype Central Portal token values:
      # CENTRAL_USERNAME = namecode
      # CENTRAL_PASSWORD = secret
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

          # Inject correct Sonatype Central credentials
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ "$version" =~ ^(patch|minor|major)$ ]]; then
            current=$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' pom.xml | head -n1)
            current="${current%-SNAPSHOT}"
            IFS=. read -r major minor patch <<< "$current"
            case "$version" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
            esac
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set project version
        run: mvn $MAVEN_ARGS versions:set -DnewVersion="${{ steps.version.outputs.value }}" -DgenerateBackupPoms=false

      - name: Import and trust GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          KEY_FP=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')
          test -n "$KEY_FP"
          echo "$KEY_FP:6:" | gpg --import-ownertrust
          echo "KEY_FP=$KEY_FP" >> "$GITHUB_ENV"

      - name: Configure GPG
        run: echo "GPG_TTY=$(tty)" >> "$GITHUB_ENV"

      - name: Verify GPG signing
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "test" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" --clearsign > /dev/null

      - name: Deploy to Maven Central
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn $MAVEN_ARGS clean deploy -Pcentral -Dgpg.passphrase="$GPG_PASSPHRASE"
